# Confetti — Slack app manifest
#
# Before pasting into https://api.slack.com/apps (Create New App → From a manifest),
# replace every `${APP_BASE_URL}` below with your real public URL
# (e.g. https://confetti.vercel.app or your ngrok tunnel for local dev).
# Slack does not interpolate env vars in this file.

display_information:
  name: Confetti
  description: Quietly runs the joyful parts of your team's culture — birthdays and anniversaries.
  background_color: "#6E40C9"

features:
  bot_user:
    display_name: Confetti
    always_online: true
  slash_commands:
    - command: /confetti
      url: ${APP_BASE_URL}/api/slack/commands
      description: Manage Confetti settings (channel, budget, opt-outs)
      usage_hint: "[setup|channel|budget|opt-outs|help]"
      should_escape: false

oauth_config:
  redirect_urls:
    - ${APP_BASE_URL}/api/slack/oauth_callback
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - channels:read
      - groups:read
      - commands
      - users:read
      - users:read.email
      - im:history
      - im:write

settings:
  event_subscriptions:
    request_url: ${APP_BASE_URL}/api/slack/events
    bot_events:
      - message.im
      - app_uninstalled
  interactivity:
    is_enabled: true
    request_url: ${APP_BASE_URL}/api/slack/interactivity
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
